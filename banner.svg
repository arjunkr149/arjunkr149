<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Arjun - cybersecurity and full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0709"/>
      <stop offset="0.6" stop-color="#1a0a12"/>
      <stop offset="1" stop-color="#3a0b1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e11d48" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#e11d48" stroke-opacity="0.35"/>

  <!-- left: name -->
  <text x="56" y="76" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="3" fill="#fb7185">CYBERSECURITY / ETHICAL HACKING / FULL-STACK / AI-ML</text>
  <text x="56" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#fff1f2">Arjun<tspan fill="#e11d48">.</tspan></text>
  <text x="56" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#fda4af">Breaking things to build them secure.</text>
  <text x="56" y="262" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#fecdd3">B.Tech CSE, final year  |  arjunkr149  |  arjunxploit.netlify.app</text>

  <!-- right: terminal card -->
  <g transform="translate(720,52)">
    <rect width="420" height="216" rx="12" fill="#0b0709" fill-opacity="0.85" stroke="#e11d48" stroke-opacity="0.6"/>
    <circle cx="22" cy="22" r="6" fill="#e11d48"/>
    <circle cx="42" cy="22" r="6" fill="#fb7185" fill-opacity="0.7"/>
    <circle cx="62" cy="22" r="6" fill="#fda4af" fill-opacity="0.5"/>
    <line x1="0" y1="44" x2="420" y2="44" stroke="#e11d48" stroke-opacity="0.3"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="16">
      <text x="24" y="78" fill="#fb7185">$ <tspan fill="#fff1f2">whoami</tspan></text>
      <text x="24" y="102" fill="#fecdd3">arjun // security + dev</text>
      <text x="24" y="138" fill="#fb7185">$ <tspan fill="#fff1f2">cat focus.txt</tspan></text>
      <text x="24" y="162" fill="#fecdd3">web security, network defense,</text>
      <text x="24" y="184" fill="#fecdd3">blockchain, applied AI</text>
      <text x="24" y="206" fill="#fb7185">$ <tspan fill="#fff1f2">_</tspan>
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- animated scan line -->
  <rect x="0" y="0" width="1200" height="2" fill="#e11d48" fill-opacity="0.35">
    <animate attributeName="y" values="0;318;0" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
